<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Smart Parking - Admin Payments</title>

    <link rel="stylesheet"
          href="css/style.css">

</head>


<body>

<div class="dashboard">


    <!-- ========================================
         HEADER
    ========================================= -->

    <header class="dashboard-header">

        <div>

            <h1>🚗 Smart Parking</h1>

            <p>Admin Payment Management</p>

        </div>


        <div class="user-info">

            <span id="userName">
                Admin
            </span>

            <span id="userRole">
                ADMIN
            </span>


            <button id="backBtn">
                Admin Dashboard
            </button>


            <button id="logoutBtn">
                Logout
            </button>

        </div>

    </header>



    <!-- ========================================
         INTRO
    ========================================= -->

    <section class="welcome-section">

        <h2>💳 Payment Management</h2>

        <p>
            View and manage all parking payments.
        </p>

    </section>



    <!-- ========================================
         PAYMENT SUMMARY
    ========================================= -->

    <section class="stats">


        <div class="stat-card">

            <h3>💰 Total Revenue</h3>

            <p id="totalRevenue">
                ₹0
            </p>

        </div>


        <div class="stat-card">

            <h3>💳 Total Payments</h3>

            <p id="totalPayments">
                0
            </p>

        </div>


        <div class="stat-card">

            <h3>✅ Successful</h3>

            <p id="successfulPayments">
                0
            </p>

        </div>


        <div class="stat-card">

            <h3>❌ Failed</h3>

            <p id="failedPayments">
                0
            </p>

        </div>

    </section>



    <!-- ========================================
         PAYMENT LIST
    ========================================= -->

    <section class="reservation-list-section">

        <h2>
            📋 All Payments
        </h2>


        <div id="paymentContainer">

            <p class="loading">
                Loading payments...
            </p>

        </div>

    </section>


</div>


<script src="js/admin-payments.js"></script>

</body>

</html>
