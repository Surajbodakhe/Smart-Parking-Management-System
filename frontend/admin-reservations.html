<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Smart Parking - Admin Reservations</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="dashboard">

        <!-- HEADER -->
        <header class="dashboard-header">

            <div>
                <h1>🚗 Smart Parking</h1>
                <p>Admin Reservation Management</p>
            </div>

            <div class="user-info">

                <span id="userName">Admin</span>

                <span id="userRole">ADMIN</span>

                <button id="backBtn">
                    Admin Dashboard
                </button>

                <button id="logoutBtn">
                    Logout
                </button>

            </div>

        </header>


        <!-- INTRO -->
        <section class="welcome-section">

            <h2>📅 Reservation Management</h2>

            <p>
                View and manage all parking reservations.
            </p>

        </section>


        <!-- FILTER -->
        <section class="reservation-form-section">

            <div class="reservation-form-card">

                <h2>🔍 Filter Reservations</h2>

                <div class="search-box">

                    <select id="statusFilter">

                        <option value="ALL">
                            All Status
                        </option>

                        <option value="PENDING">
                            Pending
                        </option>

                        <option value="CONFIRMED">
                            Confirmed
                        </option>

                        <option value="CANCELLED">
                            Cancelled
                        </option>

                        <option value="COMPLETED">
                            Completed
                        </option>

                    </select>

                    <button id="filterBtn">
                        Filter
                    </button>

                </div>

            </div>

        </section>


        <!-- RESERVATION LIST -->
        <section class="reservation-list-section">

            <h2>📋 All Reservations</h2>

            <div id="reservationContainer">

                <p class="loading">
                    Loading reservations...
                </p>

            </div>

        </section>

    </div>


    <script src="js/admin-reservations.js"></script>

</body>

</html>
