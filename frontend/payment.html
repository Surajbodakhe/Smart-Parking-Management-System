<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Smart Parking - Payments</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="dashboard">

        <!-- HEADER -->
        <header class="dashboard-header">

            <div>
                <h1>🚗 Smart Parking</h1>
                <p>Payment Management</p>
            </div>

            <div class="user-info">

                <span id="userName">User</span>

                <span id="userRole">USER</span>

                <button id="backBtn">
                    Dashboard
                </button>

                <button id="logoutBtn">
                    Logout
                </button>

            </div>

        </header>


        <!-- WELCOME -->
        <section class="welcome-section">

            <h2>💳 Payment Management</h2>

            <p>
                Calculate parking fees and view payment history.
            </p>

        </section>


        <!-- FEE CALCULATION -->
        <section class="reservation-form-section">

            <div class="reservation-form-card">

                <h2>💰 Calculate Parking Fee</h2>

                <form id="feeForm">

                    <label for="sessionSelect">
                        Select Parking Session
                    </label>

                    <select id="sessionSelect" required>

                        <option value="">
                            Select completed session
                        </option>

                    </select>

                    <button type="submit">
                        Calculate Fee
                    </button>

                    <p id="feeMessage"></p>

                </form>


                <!-- FEE RESULT -->

                <div id="feeResult"></div>

            </div>

        </section>


        <!-- PAYMENT FORM -->

        <section
            class="reservation-form-section"
            id="paymentSection"
            style="display:none;"
        >

            <div class="reservation-form-card">

                <h2>💳 Make Payment</h2>

                <form id="paymentForm">

                    <label>
                        Amount
                    </label>

                    <input
                        type="number"
                        id="paymentAmount"
                        readonly
                    >

                    <label>
                        Payment Method
                    </label>

                    <select
                        id="paymentMethod"
                        required
                    >

                        <option value="">
                            Select payment method
                        </option>

                        <option value="UPI">
                            UPI
                        </option>

                        <option value="CARD">
                            Card
                        </option>

                        <option value="CASH">
                            Cash
                        </option>

                    </select>

                    <button type="submit">
                        Pay Now
                    </button>

                    <p id="paymentMessage"></p>

                </form>

            </div>

        </section>


        <!-- PAYMENT HISTORY -->

        <section class="reservation-list-section">

            <h2>📋 Payment History</h2>

            <div id="paymentContainer">

                <p class="loading">
                    Loading payments...
                </p>

            </div>

        </section>

    </div>


    <script src="js/payment.js"></script>

</body>

</html>
